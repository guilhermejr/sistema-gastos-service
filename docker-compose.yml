services:
  gastos-service:
    image: guilhermejr/sistema-gastos-service
    container_name: gastos-service
    restart: always
    env_file: /home/guilhermejr/secrets/gastos-service.env
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    mem_limit: 768m
    environment:
      - JAVA_TOOL_OPTIONS=-XX:MaxRAMPercentage=50 -XX:+ExitOnOutOfMemoryError
    ports:
      - "127.0.0.1:9008:9008"

networks:
  default:
    external: true
    name: rede